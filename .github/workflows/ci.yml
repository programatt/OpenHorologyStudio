# SPDX-License-Identifier: Apache-2.0
# Continuous integration. The Linux job is the one exercised during development; the macOS and
# Windows jobs follow the same steps through the CMake presets and have not been run yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 python3-dev python3-pip \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev libocct-foundation-dev \
            libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libeigen3-dev \
            libcli11-dev libspdlog-dev nlohmann-json3-dev libtomlplusplus-dev catch2 poppler-utils
          python3 -m pip install --break-system-packages nanobind scikit-build-core
      - name: Build and test (release, with Python)
        run: |
          cmake --preset release -DOHS_BUILD_PYTHON=ON
          cmake --build --preset release
          ctest --preset release --output-on-failure
      - name: Documentation commands exist
        run: python3 scripts/check_docs.py --ohs build/release/src/ohs
      - name: Package
        run: |
          cpack --config build/release/CPackConfig.cmake -G DEB
          cpack --config build/release/CPackConfig.cmake -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: "*.deb\n*.tar.gz"

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 \
            libocct-data-exchange-dev libocct-modeling-algorithms-dev libocct-foundation-dev \
            libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libeigen3-dev \
            libcli11-dev libspdlog-dev nlohmann-json3-dev libtomlplusplus-dev catch2
      - name: Build and test under ASan and UBSan
        run: ./build.sh --asan

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja opencascade eigen cli11 spdlog nlohmann-json tomlplusplus catch2
      - name: Build and test
        run: |
          cmake --preset macos-release
          cmake --build --preset macos-release
          ctest --preset macos-release --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./build.ps1

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages mkdocs mkdocs-material
      - run: mkdocs build --strict
